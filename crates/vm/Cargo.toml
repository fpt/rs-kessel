[package]
name = "kessel-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "A tiny deterministic fantasy-console VM: stack machine, assembler, Lua-ish front-end, and the vm_* agent tool surface."

[dependencies]
