# reverse — so a standalone instrument can link kessel-audio without the VM.
kessel-audio = { path = "../audio" }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
