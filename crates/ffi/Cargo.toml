[package]
name = "kessel-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "C ABI and JNI bindings for the kessel console, for mobile hosts (Android now, iOS later)."

[lib]
name = "kessel_ffi"
# cdylib for Android (System.loadLibrary), staticlib for an iOS xcframework,
# rlib so the tests in this crate can exercise the C ABI in-process.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
kessel-vm = { path = "../vm" }
kessel-audio = { path = "../audio" }
parking_lot.workspace = true

# The JNI entry points are Android-only: on any other target this crate is just
# the C ABI, and nothing pulls in the jni crate.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
