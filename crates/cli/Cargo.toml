[package]
name = "kessel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The kessel fantasy console: an MCP server for agents (`kessel mcp`) and a playable window for humans (`kessel play`)."

[[bin]]
name = "kessel"
path = "src/main.rs"

[features]
# The player is on by default, but `--no-default-features` yields a pure
# headless binary — `kessel mcp` on a server or in a container has no business
# linking a window system.
default = ["play", "audio"]
play = ["dep:winit", "dep:softbuffer"]
# Sound for `kessel run`, which is why it *implies* `play`: the window is the
# only thing that plays sound, so `audio` without it would compile a device
# backend nothing can reach.
#
# It stays a separate feature because the reverse combination is real and
# useful — a machine with a screen and no sound card wants `play` alone, and
# `kessel render-audio` needs neither, rendering to a file with no device at
# all.
audio = ["play", "dep:cpal"]

[dependencies]
kessel-vm = { path = "../vm" }
kessel-audio = { path = "../audio" }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true

# Presentation only. The console rasterizes into an indexed framebuffer itself,
# so the window layer just upscales and blits pixels — no GPU pipeline needed,
# and nothing here can affect what the VM computes.
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }

# The audio device, and the first thing in this workspace that talks to one.
# It lives here rather than in kessel-audio for the same reason winit does not
# live in kessel-vm: the synth is a function from events to samples, and who
# plays those samples is the host's business.
cpal = { version = "0.15", optional = true }

[dev-dependencies]
tempfile = "3"
