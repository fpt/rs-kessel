name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Windows is in the matrix because the attach layer makes platform claims it
  # would otherwise only assert: loopback TCP rather than a Unix socket so the
  # same path works there, and session publication that relies on
  # `fs::rename` replacing an existing file (it does — std uses MoveFileExW /
  # SetFileInformationByHandle, not the Win32 `MoveFile` that refuses).
  # Those are worth testing rather than reasoning about.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # The two default-on features are the only things here that need system
      # libraries: `play` (winit + softbuffer) wants X11/Wayland headers, and
      # `audio` (cpal) wants ALSA. Nothing in kessel-vm or kessel-audio needs
      # either — see the `headless` job.
      - name: Install window-system and audio headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
                                  libxcb1-dev libxrandr-dev libxi-dev pkg-config \
                                  libasound2-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Test
        working-directory: crates
        run: cargo test

      # A screen with no sound card is a real machine, so the player has to
      # build without the audio backend — easy to break by reaching for
      # `crate::audio` outside its cfg. (The reverse is not a configuration:
      # `audio` implies `play`, because the window is the only thing that plays
      # sound.) Linux only, since it is the platform where the two features
      # pull in different system libraries.
      - name: The player builds without sound
        if: runner.os == 'Linux'
        working-directory: crates
        run: cargo build -p kessel --no-default-features --features play

  # `kessel mcp` must build and pass with no window system at all — that is the
  # configuration it runs in on a server or in a container, and it is easy to
  # break by reaching for a windowing type outside the `play` feature.
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test without the player
        working-directory: crates
        run: |
          cargo build --no-default-features
          cargo test -p kessel-vm
          cargo test -p kessel --no-default-features

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - working-directory: crates
        run: cargo fmt --check
